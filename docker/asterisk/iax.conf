[general]
bindaddr=0.0.0.0
bindport=4569
disallow=all
allow=opus
allow=ulaw
allow=alaw
; Take the codec the client asks for first, so that its -codec choice
; decides; the default (host) would always pick the first allow= above.
codecpriority=caller
jitterbuffer=yes
; Set to yes once AES-128 is implemented in the client.
encryption=no

[phone]
type=friend
host=dynamic
qualify=yes
secret=s3cret
context=iaxphone
disallow=all
allow=opus
allow=ulaw
allow=alaw
