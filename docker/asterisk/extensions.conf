[general]
static=yes
writeprotect=yes

[iaxphone]
; Echo test: whatever you send comes back.
exten => 600,1,Answer()
 same => n,Echo()

; 1004 Hz test tone for 5 s, then Asterisk hangs up. No sound files needed.
exten => 601,1,Answer()
 same => n,Set(TIMEOUT(absolute)=5)
 same => n,Milliwatt()
 same => n,Hangup()

; Plays a sound file (from the core sounds added by the Dockerfile).
exten => 602,1,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()

; DTMF echo: reads up to 4 keys (5 s timeout) and sends them back.
exten => 603,1,Answer()
 same => n,Wait(1)
 same => n,Read(KEYS,,4,,1,5)
 same => n,NoOp(keys received: ${KEYS})
 same => n,SendDTMF(${KEYS},100,100)
 same => n,Wait(1)
 same => n,Hangup()

; Asterisk presses keys at us.
exten => 604,1,Answer()
 same => n,Wait(1)
 same => n,SendDTMF(159*#,100,100)
 same => n,Wait(1)
 same => n,Hangup()

; Any other number: answer and play the "not in service" prompt, as a real
; PBX would. A pattern rather than the i extension: chan_iax2 rejects a NEW
; for an extension the dialplan does not have before the i extension could
; run, so the catch-all has to exist as an extension.
exten => _[0-9*#].,1,Answer()
 same => n,Wait(1)
 same => n,Playback(ss-noservice)
 same => n,Hangup()

; Call the registered softphone with a caller id, e.g. from the console:
;   channel originate Local/phone@iaxphone application Milliwatt
exten => phone,1,Set(CALLERID(all)="Test Caller" <1001>)
 same => n,Dial(IAX2/phone,30)
 same => n,Hangup()
