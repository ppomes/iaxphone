name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install the X11, Wayland and GL headers Fyne builds against
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pkgconf libopus-dev libgl-dev libegl-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev \
            libxxf86vm-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install the X11, Wayland and GL headers Fyne builds against
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pkgconf libopus-dev libgl-dev libegl-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev \
            libxxf86vm-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
